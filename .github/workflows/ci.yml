# ============================================================
#  تكامل مستمرّ — بوّابةُ جودةٍ وأمنٍ على كل طلب دمج (HMY-19)
#  يفحص: تعارض الأنواع · قواعد ESLint · ثغرات التبعيّات · تسرّب الأسرار.
#  فحصا audit/gitleaks يُحذّران ولا يُفشِلان (report-only) حتى تُنقّى القاعدة.
# ============================================================
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hemaya-app
    steps:
      - uses: actions/checkout@v4
      # نثبّت النسخة صراحةً: packageManager في hemaya-app/package.json لا الجذر،
      # وaction-setup يقرأ الجذر افتراضياً. 11.1.2 يطابق packageManager.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hemaya-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: تعارض الأنواع
        run: pnpm run typecheck
      - name: قواعد ESLint
        run: pnpm -r --if-present run lint
      - name: ثغرات التبعيّات (عالية+)
        run: pnpm audit --audit-level=high
        continue-on-error: true

  # ── حارس قائمة نشر التجريبية ──
  #  القائمة في oneshot صريحةٌ لا glob (الترتيب مقصود وبعض المهاجرات لا تصحّ
  #  إعادتها)، فمهاجرةٌ تُدمج ولا تُدرَج لا تبلغ التجريبية أبداً — والشيفرة
  #  تبلغها بـredeploy، فتُنشر واجهةٌ تنادي دوالَّ غير موجودة. وقع ذلك ثلاث
  #  مرّات (11 و16 أغسطس · 8 سبتمبر).
  #
  #  كان الحارس معلَّقاً على خطّاف pre-push المحلّي وحده — وثبت أنّه لا يصلح
  #  ضماناً: core.hooksPath يُضبط لكلّ نسخة عملٍ على حدة، وأداة إنشاء النسخ
  #  تكتب مساراً مطلقاً إلى نسخةٍ قد تكون مركونةً على فرعٍ قديم، فيُنفَّذ
  #  خطّافٌ سابقٌ للحارس بصمت. الخطّاف تغذيةٌ راجعةٌ سريعة، وهذه البوّابة هي
  #  الإنفاذ: لا تعتمد على إعدادٍ محلّيٍّ ولا يمكن تجاوزها.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: اكتمال قائمة نشر التجريبية
        run: ./deploy/check-staging-list.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gitleaks عبر الصورة الرسميّة مباشرةً (لا تكامل GitHub API فلا يحتاج
      # صلاحيات كتابة). report-only الآن: يطبع النتائج ولا يُفشِل الطلب.
      - name: فحص تسرّب الأسرار
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --no-git --redact --verbose || \
            echo "::warning::gitleaks رصد نتائج محتملة — راجعها (report-only)."
