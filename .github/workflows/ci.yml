# ============================================================
#  تكامل مستمرّ — بوّابةُ جودةٍ وأمنٍ على كل طلب دمج (HMY-19)
#  يفحص: تعارض الأنواع · قواعد ESLint · ثغرات التبعيّات · تسرّب الأسرار.
#  فحصا audit/gitleaks يُحذّران ولا يُفشِلان (report-only) حتى تُنقّى القاعدة.
# ============================================================
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hemaya-app
    steps:
      - uses: actions/checkout@v4
      # نثبّت النسخة صراحةً: packageManager في hemaya-app/package.json لا الجذر،
      # وaction-setup يقرأ الجذر افتراضياً. 11.1.2 يطابق packageManager.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hemaya-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: تعارض الأنواع
        run: pnpm run typecheck
      - name: قواعد ESLint
        run: pnpm -r --if-present run lint
      - name: ثغرات التبعيّات (عالية+)
        run: pnpm audit --audit-level=high
        continue-on-error: true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gitleaks عبر الصورة الرسميّة مباشرةً (لا تكامل GitHub API فلا يحتاج
      # صلاحيات كتابة). report-only الآن: يطبع النتائج ولا يُفشِل الطلب.
      - name: فحص تسرّب الأسرار
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --no-git --redact --verbose || \
            echo "::warning::gitleaks رصد نتائج محتملة — راجعها (report-only)."
