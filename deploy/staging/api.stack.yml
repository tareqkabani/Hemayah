# ============================================================
# Portainer Stack — سيرفر الـ APIs
# Compose path: deploy/staging/api.stack.yml
# ============================================================
services:
  hemaya-api:
    build:
      context: ../..
      dockerfile: deploy/staging/docker/api.Dockerfile
    # HMY-06: الـAPI يُخدَم HTTP على 3020. الواجهةُ تصله خادميّاً (Next rewrite)،
    # فإن كانا على مضيفٍ واحد ضعهما على شبكة Compose واحدة واحذف هذا النشر.
    # وإن كانا على مضيفين، فاقصر الوصول على مضيف الواجهة عبر جدار الشبكة
    # (‏3020 غير مشفّر — لا يُكشف على الإنترنت؛ التجريبيّةُ خلف عزلٍ شبكيّ).
    ports:
      - "3020:3020"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: "http://${DB_HOST}:55321"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY}"
      NAFATH_BRIDGE_PASSWORD: "${NAFATH_BRIDGE_PASSWORD}"
      API_PORT: "3020"
    restart: unless-stopped
